<!DOCTYPE html>
<html>
<head>
  <title>Karaoke Friday 🎤</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #0b1f3a; /* navy blue */
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    #loading {
      font-size: 5vw;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-weight: bold;
  letter-spacing: 1px;
    }

    .popup {
      display: none;
      background: #0b1f3a; /* navy blue */
      width: 90%;
      height: 90%;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 40, 90, 0.9);
      padding: 5%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .line {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
      margin: 1.5vh 0;
      font-size: 2.5vw;
      max-width: 90%;
    }

    h2.line {
      font-size: 4vw;
      margin-bottom: 2vh;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile optimization */
    @media (max-width: 600px) {
      #loading {
        font-size: 6vw;
      }

      h2.line {
        font-size: 7vw;
      }

      .line {
        font-size: 4.5vw;
      }
    }

    .emoji {
      position: absolute;
      animation: floatUp 3s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div id="loading">🎤 Connecting to Karaoke System...</div>

<div class="popup" id="popup">
  <h2 class="line">🎤 APRIL FOOLS 🎤</h2>

  <p class="line">There is no Karaoke Friday.</p>

  <p class="line">But the fact that you clicked this link…</p>

  <p class="line">tells us everything we need to know.</p>

  <p class="line">Some of you were READY.</p>

  <p class="line">Mentally. Emotionally. Vocally.</p>

  <p class="line"><b>HR is taking notes.</b></p>

  <p class="line"><b>We’re here for you.</b></p>
</div>

<script>
  setTimeout(() => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("popup").style.display = "flex";

    startReveal();
    startConfetti();
    startEmojis();
  }, 2000);

  function startReveal() {
    const lines = document.querySelectorAll(".line");
    lines.forEach((line, index) => {
      setTimeout(() => {
        line.classList.add("show");
      }, index * 900);
    });
  }

  function startConfetti() {
    setInterval(() => {
      confetti({
        particleCount: 100,
        spread: 120,
        origin: { y: 0.6 }
      });
    }, 800);
  }

  const emojis = ["😂","🤣","🎤","😜","🤡","🔥","🙈","🎶"];

  function startEmojis() {
    setInterval(() => {
      const emoji = document.createElement("div");
      emoji.classList.add("emoji");
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.fontSize = (20 + Math.random() * 40) + "px";

      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 3000);
    }, 250);
  }
</script>

</body>
</html>
