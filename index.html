<!DOCTYPE html>
<html>
<head>
  <title>Karaoke Friday 🎤</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    #loading {
      font-size: 22px;
    }

    .popup {
      display: none;
      background: #ff1a1a;
      padding: 30px;
      border-radius: 12px;
      max-width: 450px;
      box-shadow: 0 0 30px rgba(255,0,0,0.9);
    }

    .line {
      opacity: 0;
      margin: 10px 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

    .emoji {
      position: absolute;
      font-size: 24px;
      animation: floatUp 3s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div id="loading">🎤 Connecting to Karaoke System...</div>

<div class="popup" id="popup">
  <h2 class="line">🎤 APRIL FOOLS 🎤</h2>

  <p class="line">There is no Karaoke Friday.</p>

  <p class="line">But the fact that you clicked this link…</p>

  <p class="line">tells us everything we need to know.</p>

  <p class="line">Some of you were READY.</p>

  <p class="line">Mentally. Emotionally. Vocally.</p>

  <p class="line"><b>HR is taking notes.</b></p>

  <p class="line"><b>We’re here for you.</b></p>
</div>

<script>
  // Show popup
  setTimeout(() => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("popup").style.display = "block";

    startReveal();
    startConfetti();
    startEmojis();
  }, 2000);

  // Line-by-line reveal
  function startReveal() {
    const lines = document.querySelectorAll(".line");
    lines.forEach((line, index) => {
      setTimeout(() => {
        line.classList.add("show");
      }, index * 800);
    });
  }

  // Confetti
  function startConfetti() {
    setInterval(() => {
      confetti({
        particleCount: 80,
        spread: 100,
        origin: { y: 0.6 }
      });
    }, 900);
  }

  // Emojis
  const emojis = ["😂","🤣","🎤","😜","🤡","🔥","🙈","🎶"];

  function startEmojis() {
    setInterval(() => {
      const emoji = document.createElement("div");
      emoji.classList.add("emoji");
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.fontSize = (20 + Math.random() * 30) + "px";

      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 3000);
    }, 300);
  }
</script>

</body>
</html>
