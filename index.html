<!DOCTYPE html>
<html>
<head>
  <title>Karaoke Friday 🎤</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b1f3a;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* LOADING SCREEN */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      text-align: center;
    }

    #loading-text {
      font-size: 5vw;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #progress-container {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #00c3ff;
    }

    #percentage {
      margin-top: 10px;
      font-size: 3vw;
    }

    /* POPUP */
    .popup {
      display: none;
      background: #0b1f3a;
      width: 90%;
      height: 90%;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0,40,90,0.9);
      padding: 5%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .line {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
      margin: 1.5vh 0;
      font-size: 2.5vw;
      max-width: 90%;
    }

    h2.line {
      font-size: 4vw;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

    /* MOBILE */
    @media (max-width: 600px) {
      #loading-text { font-size: 6vw; }
      #percentage { font-size: 4vw; }
      h2.line { font-size: 7vw; }
      .line { font-size: 4.5vw; }
    }

    /* EMOJIS */
    .emoji {
      position: absolute;
      animation: floatUp 3s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div id="loading-text">🎤 Connecting to Karaoke System...</div>
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>
  <div id="percentage">0%</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <h2 class="line">🎤 APRIL FOOLS 🎤</h2>
  <p class="line">There is no Karaoke Friday.</p>
  <p class="line">But the fact that you clicked this link…</p>
  <p class="line">tells us everything we need to know.</p>
  <p class="line">Some of you were READY.</p>
  <p class="line">Mentally. Emotionally. Vocally.</p>
  <p class="line"><b>HR is taking notes.</b></p>
  <p class="line"><b>We’re here for you.</b></p>
</div>

<script>
  // LOADING BAR
  let progress = 0;
  let interval = setInterval(() => {
    progress += Math.floor(Math.random() * 8) + 2;

    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);

      document.getElementById("loading").style.display = "none";
      document.getElementById("popup").style.display = "flex";

      startReveal();
      startConfetti();
      startEmojis();
    }

    document.getElementById("progress-bar").style.width = progress + "%";
    document.getElementById("percentage").innerText = progress + "%";
  }, 120);

  // TEXT REVEAL
  function startReveal() {
    const lines = document.querySelectorAll(".line");
    lines.forEach((line, index) => {
      setTimeout(() => {
        line.classList.add("show");
      }, index * 900);
    });
  }

  // CONFETTI
  function startConfetti() {
    setInterval(() => {
      confetti({
        particleCount: 100,
        spread: 120,
        origin: { y: 0.6 }
      });
    }, 800);
  }

  // EMOJIS
  const emojis = ["😂","🤣","🎤","😜","🤡","🔥","🙈","🎶"];

  function startEmojis() {
    setInterval(() => {
      const emoji = document.createElement("div");
      emoji.classList.add("emoji");
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.fontSize = (20 + Math.random() * 40) + "px";

      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 3000);
    }, 250);
  }
</script>

</body>
</html>
